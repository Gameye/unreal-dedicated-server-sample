[/Script/EngineSettings.GameMapsSettings]
; The project has no content of its own. The engine's empty Entry map is enough
; to boot a server and accept connections. Use your own maps in a real game.
GameDefaultMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/DedicatedServerSample.SampleGameMode

[URL]
; The container port. In bridge mode Gameye maps it to a free port on the node.
Port=7777
